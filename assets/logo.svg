<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120" role="img" aria-label="Robot Coupons">
  <defs>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#ffd6d6"/>
      <stop offset="52%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#cc1818"/>
    </linearGradient>
    <linearGradient id="botGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8f4ff"/>
      <stop offset="55%" stop-color="#6dd5ed"/>
      <stop offset="100%" stop-color="#2c9bb8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- R -->
    <text x="26" y="64" font-family="'Lexend Deca', 'Arial Black', sans-serif" font-weight="900" font-size="54" fill="url(#textGrad)" stroke="#111111" stroke-width="6" paint-order="stroke fill" letter-spacing="1">R</text>

    <!-- Cute Robot Head replacing O -->
    <g transform="translate(76, 12)">
      <!-- Antenna -->
      <line x1="25" y1="12" x2="25" y2="3" stroke="#111111" stroke-width="5" stroke-linecap="round"/>
      <circle cx="25" cy="4" r="5" fill="#ff9f1c" stroke="#111111" stroke-width="2.5"/>
      <!-- Side Ears -->
      <rect x="-4" y="25" width="7" height="14" rx="3" fill="#ff4d4d" stroke="#111111" stroke-width="2.5"/>
      <rect x="47" y="25" width="7" height="14" rx="3" fill="#ff4d4d" stroke="#111111" stroke-width="2.5"/>
      <!-- Head Box -->
      <rect x="2" y="12" width="46" height="42" rx="10" fill="url(#botGrad)" stroke="#111111" stroke-width="4"/>
      <!-- Eyes -->
      <circle cx="16" cy="29" r="6.5" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
      <circle cx="16" cy="29" r="2.5" fill="#111111"/>
      <circle cx="34" cy="29" r="6.5" fill="#ffffff" stroke="#111111" stroke-width="2.2"/>
      <circle cx="34" cy="29" r="2.5" fill="#111111"/>
      <!-- Mouth -->
      <rect x="13" y="40" width="24" height="7" rx="3" fill="#ffffff" stroke="#111111" stroke-width="2"/>
      <line x1="19" y1="40" x2="19" y2="47" stroke="#111111" stroke-width="1.8"/>
      <line x1="25" y1="40" x2="25" y2="47" stroke="#111111" stroke-width="1.8"/>
      <line x1="31" y1="40" x2="31" y2="47" stroke="#111111" stroke-width="1.8"/>
    </g>

    <!-- BOT -->
    <text x="134" y="64" font-family="'Lexend Deca', 'Arial Black', sans-serif" font-weight="900" font-size="54" fill="url(#textGrad)" stroke="#111111" stroke-width="6" paint-order="stroke fill" letter-spacing="1">BOT</text>

    <!-- COUPONS -->
    <text x="160" y="108" text-anchor="middle" font-family="'Lexend Deca', 'Arial Black', sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" stroke="#111111" stroke-width="6" paint-order="stroke fill" letter-spacing="1.5">COUPONS</text>
  </g>
</svg>
